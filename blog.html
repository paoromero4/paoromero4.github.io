<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paola Romero's Blog</title>
  <link rel="stylesheet" href="css/blog-style.css">
</head>
<body>
  <div class="garden-container">
    <h1 class="garden-title">paola romero's blog.</h1>

    <div class="garden" id="garden">
      <!-- Plant 1: Sunflower - positioned randomly -->
      <div class="plant-container"
           style="left: 20%; top: 30%; width: 120px; height: 140px;"
           data-blog-title="My First Blog Post"
           data-blog-date="December 30, 2024"
           data-blog-subtitle="Exploring the intersection of design and technology"
           data-blog-link="pages/first-post.html">
        <svg class="plant-svg" viewBox="0 0 120 140" xmlns="http://www.w3.org/2000/svg">
          <!-- Stem -->
          <path d="M60 140 Q58 100 60 70" stroke="#5a8a3a" stroke-width="3" fill="none"/>
          <!-- Leaves -->
          <ellipse cx="50" cy="90" rx="12" ry="20" fill="#6da83f" transform="rotate(-30 50 90)"/>
          <ellipse cx="70" cy="100" rx="12" ry="20" fill="#6da83f" transform="rotate(30 70 100)"/>
          <!-- Flower center -->
          <circle cx="60" cy="40" r="15" fill="#8B4513"/>
          <!-- Petals -->
          <ellipse cx="60" cy="20" rx="8" ry="15" fill="#FFD700"/>
          <ellipse cx="80" cy="30" rx="8" ry="15" fill="#FFD700" transform="rotate(45 80 30)"/>
          <ellipse cx="85" cy="50" rx="8" ry="15" fill="#FFD700" transform="rotate(90 85 50)"/>
          <ellipse cx="75" cy="65" rx="8" ry="15" fill="#FFD700" transform="rotate(135 75 65)"/>
          <ellipse cx="60" cy="70" rx="8" ry="15" fill="#FFD700" transform="rotate(180 60 70)"/>
          <ellipse cx="45" cy="65" rx="8" ry="15" fill="#FFD700" transform="rotate(225 45 65)"/>
          <ellipse cx="35" cy="50" rx="8" ry="15" fill="#FFD700" transform="rotate(270 35 50)"/>
          <ellipse cx="40" cy="30" rx="8" ry="15" fill="#FFD700" transform="rotate(315 40 30)"/>
        </svg>
      </div>

      <!-- Plant 2: Tulip - positioned randomly -->
      <div class="plant-container"
           style="left: 60%; top: 45%; width: 100px; height: 130px;"
           data-blog-title="Thoughts on Creative Process"
           data-blog-date="December 28, 2024"
           data-blog-subtitle="How I approach new projects and stay inspired"
           data-blog-link="pages/creative-process.html">
        <svg class="plant-svg" viewBox="0 0 100 130" xmlns="http://www.w3.org/2000/svg">
          <!-- Stem -->
          <path d="M50 130 Q48 85 50 50" stroke="#5a8a3a" stroke-width="3" fill="none"/>
          <!-- Leaf -->
          <path d="M50 80 Q35 75 30 85 Q28 90 35 95 Q45 88 50 80" fill="#6da83f"/>
          <!-- Tulip petals (closed tulip shape) -->
          <ellipse cx="50" cy="30" rx="18" ry="25" fill="#FF69B4"/>
          <ellipse cx="38" cy="35" rx="12" ry="22" fill="#FF1493" transform="rotate(-25 38 35)"/>
          <ellipse cx="62" cy="35" rx="12" ry="22" fill="#FF1493" transform="rotate(25 62 35)"/>
          <!-- Center highlight -->
          <ellipse cx="50" cy="28" rx="6" ry="10" fill="#FFB6C1" opacity="0.6"/>
        </svg>
      </div>
    </div>
  </div>

  <!-- Hover info box -->
  <div class="info-box" id="infoBox">
    <div class="info-box-title" id="infoTitle"></div>
    <div class="info-box-date" id="infoDate"></div>
    <div class="info-box-subtitle" id="infoSubtitle"></div>
  </div>

  <script src="js/blog-hover-box.js"></script>
</body>
</html>
